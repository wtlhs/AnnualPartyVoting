<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票统计 - 年会最佳服装评选</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/mobile-stats.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>投票统计</h1>
            <div class="update-info">
                <span id="lastUpdateTime">--:--:--</span>
                <button id="refreshBtn" class="refresh-btn" title="刷新数据">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="m20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                    </svg>
                </button>
            </div>
        </header>
        
        <main>
            <!-- 统计概览 -->
            <section class="stats-overview">
                <h2>投票概览</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalParticipants">0</div>
                        <div class="stat-label">参与人数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalVotes">0</div>
                        <div class="stat-label">总投票数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="maleParticipants">0</div>
                        <div class="stat-label">男性参与者</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="femaleParticipants">0</div>
                        <div class="stat-label">女性参与者</div>
                    </div>
                </div>
            </section>

            <!-- 投票进度 -->
            <section class="voting-progress">
                <h2>投票进度</h2>
                <div class="progress-info">
                    <div class="progress-item">
                        <div class="progress-label">
                            <span>男性组投票率</span>
                            <span id="maleVoteRate" class="progress-percentage">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div id="maleProgressBar" class="progress-fill male"></div>
                        </div>
                    </div>
                    <div class="progress-item">
                        <div class="progress-label">
                            <span>女性组投票率</span>
                            <span id="femaleVoteRate" class="progress-percentage">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div id="femaleProgressBar" class="progress-fill female"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 排名展示 -->
            <section class="rankings-section">
                <h2>实时排名</h2>
                
                <!-- 性别切换标签 -->
                <div class="gender-tabs">
                    <button class="tab-btn active" data-gender="male">男性组</button>
                    <button class="tab-btn" data-gender="female">女性组</button>
                </div>
                
                <!-- 男性组排名 -->
                <div id="maleRanking" class="ranking-content active">
                    <div class="ranking-header">
                        <h3>男性组排名</h3>
                        <span id="maleCount" class="participant-count">0人参与</span>
                    </div>
                    <div id="maleRankingList" class="ranking-list">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                
                <!-- 女性组排名 -->
                <div id="femaleRanking" class="ranking-content">
                    <div class="ranking-header">
                        <h3>女性组排名</h3>
                        <span id="femaleCount" class="participant-count">0人参与</span>
                    </div>
                    <div id="femaleRankingList" class="ranking-list">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </section>

            <!-- 最近投票活动 -->
            <section class="recent-activity">
                <h2>最近投票</h2>
                <div id="recentVotesList" class="activity-list">
                    <div class="loading">加载中...</div>
                </div>
            </section>

            <!-- 操作按钮 -->
            <div class="actions">
                <a href="/scan" class="btn-primary">继续投票</a>
                <a href="/" class="btn-secondary">返回首页</a>
            </div>
        </main>
    </div>
    
    <script src="/static/js/mobile-stats.js"></script>
</body>
</html>
