<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时排名展示 - 年会最佳服装评选</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ranking-display.css">
<link rel="icon" href="data:,">
</head>
<body>
    <div class="display-container">
        <header class="display-header">
            <h1>年会最佳服装评选 - 实时排名</h1>
            <div class="header-info">
                <div class="current-time" id="currentTime">--:--:--</div>
                <div class="last-update">
                    最后更新: <span id="lastUpdateTime">--:--:--</span>
                </div>
            </div>
        </header>
        
        <main class="display-main">
            <div class="rankings-display">
                <div class="ranking-column">
                    <h2 class="category-title male">男士组排名</h2>
                    <div id="maleRankingDisplay" class="ranking-list-display">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
                
                <div class="ranking-column">
                    <h2 class="category-title female">女士组排名</h2>
                    <div id="femaleRankingDisplay" class="ranking-list-display">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
            
            <div class="stats-display">
                <div class="stat-item">
                    <span class="stat-label">总参与人数</span>
                    <div class="stat-detail">
                        <span id="displayTotalParticipants" class="stat-number">0</span>人
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">男士总人数</span>
                    <div class="stat-detail">
                        <span id="maleParticipants" class="stat-number">0</span>人
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">男士投票进度</span>
                    <div class="stat-detail">
                        <span id="maleVotes" class="stat-number">0/0</span>
                        <span id="maleRate" class="stat-rate">0%</span>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">女士总人数</span>
                    <div class="stat-detail">
                        <span id="femaleParticipants" class="stat-number">0</span>人
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">女士投票进度</span>
                    <div class="stat-detail">
                        <span id="femaleVotes" class="stat-number">0/0</span>
                        <span id="femaleRate" class="stat-rate">0%</span>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="display-footer">
            <p>数据每30秒自动刷新 | 年会最佳服装评选系统</p>
        </footer>
    </div>
    
    <script src="/static/js/ranking-display.js"></script>
</body>
</html>
