<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投票 - 年会最佳服装评选</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>投票</h1>
            <p>输入6位数字ID进行投票</p>
        </header>
        
        <main>
            <!-- 手动输入6位数字ID -->
            <div class="manual-input" style="display: block;">
                <h3>请输入参与者的6位数字ID</h3>
                <div class="id-input-box">
                    <input type="text" id="numericIdInput" placeholder="例如：123456" maxlength="6" pattern="\d{6}" autocomplete="off">
                    <button id="submitIdBtn" class="btn-secondary">确认投票</button>
                </div>
                <div class="input-hints">
                    <p><strong>💡 提示：</strong></p>
                    <ul>
                        <li>ID必须是6位数字</li>
                        <li>可在参与者的个人资料页面查看其ID</li>
                        <li>输入完成后点击"确认投票"进行投票</li>
                    </ul>
                </div>
            </div>
            
            <div class="actions">
                <a href="/user-list" class="btn-primary" style="background: linear-gradient(135deg, #20bf55 0%, #01baef 100%);">👥 按姓名/头像投票</a>
                <a href="/" class="btn-secondary">返回首页</a>
            </div>
        </main>
    </div>
    
    <script src="/static/js/scan.js?v=2.2"></script>
</body>
</html>
