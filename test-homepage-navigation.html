<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试返回首页功能</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>测试返回首页功能</h1>
    
    <div class="test-section">
        <h2>测试不同的返回首页方式</h2>
        
        <h3>1. 直接链接到根路径</h3>
        <a href="/" class="btn btn-primary">返回首页 (href="/")</a>
        
        <h3>2. 使用完整URL</h3>
        <a href="http://localhost:3000/" class="btn btn-secondary">返回首页 (完整URL)</a>
        
        <h3>3. JavaScript跳转</h3>
        <button onclick="window.location.href = '/'" class="btn btn-primary">JavaScript跳转首页</button>
        
        <h3>4. 使用window.location.replace</h3>
        <button onclick="window.location.replace('/')" class="btn btn-secondary">Replace跳转首页</button>
        
        <h3>5. 测试当前页面信息</h3>
        <button onclick="showPageInfo()" class="btn btn-primary">显示页面信息</button>
    </div>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        function showPageInfo() {
            const info = {
                currentURL: window.location.href,
                pathname: window.location.pathname,
                hostname: window.location.hostname,
                port: window.location.port,
                protocol: window.location.protocol,
                origin: window.location.origin
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h4>当前页面信息：</h4>
                <ul>
                    <li><strong>完整URL:</strong> ${info.currentURL}</li>
                    <li><strong>路径:</strong> ${info.pathname}</li>
                    <li><strong>主机名:</strong> ${info.hostname}</li>
                    <li><strong>端口:</strong> ${info.port}</li>
                    <li><strong>协议:</strong> ${info.protocol}</li>
                    <li><strong>源:</strong> ${info.origin}</li>
                </ul>
            `;
        }
        
        // 测试网络连接
        function testConnection() {
            fetch('/')
                .then(response => {
                    if (response.ok) {
                        const resultDiv = document.getElementById('result');
                        resultDiv.className = 'result success';
                        resultDiv.style.display = 'block';
                        resultDiv.innerHTML = '<h4>✅ 网络连接正常，首页可以访问</h4>';
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                })
                .catch(error => {
                    const resultDiv = document.getElementById('result');
                    resultDiv.className = 'result error';
                    resultDiv.style.display = 'block';
                    resultDiv.innerHTML = `<h4>❌ 网络连接失败: ${error.message}</h4>`;
                });
        }
        
        // 页面加载时自动测试连接
        window.addEventListener('load', testConnection);
    </script>
</body>
</html>
