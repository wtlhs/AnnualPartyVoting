<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自投票测试 - 年会最佳服装评选</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-title {
            color: #333;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }
        .test-result {
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>自投票功能测试</h1>
    
    <div class="test-section">
        <h3 class="test-title">测试说明</h3>
        <p>这个页面用于测试系统是否正确阻止用户为自己投票。</p>
        <p>测试将模拟用户尝试为自己投票的场景，验证系统的防护机制。</p>
    </div>
    
    <div class="test-section">
        <h3 class="test-title">API 测试</h3>
        <button onclick="testSelfVoteAPI()">测试自投票 API</button>
        <button onclick="testSelfVoteEligibility()">测试自投票资格检查</button>
        <button onclick="testNormalVote()">测试正常投票</button>
        <div id="apiResults"></div>
    </div>
    
    <div class="test-section">
        <h3 class="test-title">前端过滤测试</h3>
        <p>当前用户ID: <span id="currentUserId">未设置</span></p>
        <button onclick="setCurrentUser()">设置当前用户</button>
        <button onclick="testUserListFiltering()">测试用户列表过滤</button>
        <div id="frontendResults"></div>
    </div>
    
    <script>
        // 测试用的用户ID
        const TEST_USER_ID = 'test_user_' + Date.now();
        const OTHER_USER_ID = 'other_user_' + Date.now();
        
        function addResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${type}`;
            resultDiv.textContent = message;
            container.appendChild(resultDiv);
        }
        
        function clearResults(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }
        
        async function testSelfVoteAPI() {
            clearResults('apiResults');
            addResult('apiResults', '开始测试自投票 API...', 'info');
            
            try {
                const response = await fetch('/api/votes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        voterId: TEST_USER_ID,
                        targetUserId: TEST_USER_ID
                    })
                });
                
                const result = await response.json();
                
                if (response.status === 400 && result.errorCode === 'SELF_VOTE_NOT_ALLOWED') {
                    addResult('apiResults', '✅ 自投票被正确阻止: ' + result.message, 'success');
                    addResult('apiResults', '错误代码: ' + result.errorCode, 'success');
                } else {
                    addResult('apiResults', '❌ 自投票检查失败: ' + JSON.stringify(result), 'error');
                }
                
            } catch (error) {
                addResult('apiResults', '❌ 测试出错: ' + error.message, 'error');
            }
        }
        
        async function testSelfVoteEligibility() {
            clearResults('apiResults');
            addResult('apiResults', '开始测试自投票资格检查...', 'info');
            
            try {
                const response = await fetch('/api/votes/check-eligibility', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        voterId: TEST_USER_ID,
                        targetUserId: TEST_USER_ID
                    })
                });
                
                const result = await response.json();
                
                if (result.success && !result.canVote && result.reason === '不能为自己投票') {
                    addResult('apiResults', '✅ 自投票资格检查正确: ' + result.reason, 'success');
                    addResult('apiResults', '错误代码: ' + result.errorCode, 'success');
                } else {
                    addResult('apiResults', '❌ 自投票资格检查失败: ' + JSON.stringify(result), 'error');
                }
                
            } catch (error) {
                addResult('apiResults', '❌ 测试出错: ' + error.message, 'error');
            }
        }
        
        async function testNormalVote() {
            clearResults('apiResults');
            addResult('apiResults', '开始测试正常投票（不同用户）...', 'info');
            
            try {
                const response = await fetch('/api/votes/check-eligibility', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        voterId: TEST_USER_ID,
                        targetUserId: OTHER_USER_ID
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    if (result.canVote) {
                        addResult('apiResults', '✅ 正常投票检查通过', 'success');
                    } else {
                        addResult('apiResults', '⚠️ 正常投票被阻止（可能是其他限制）: ' + result.reason, 'info');
                    }
                } else {
                    addResult('apiResults', '❌ 正常投票检查失败: ' + result.message, 'error');
                }
                
            } catch (error) {
                addResult('apiResults', '❌ 测试出错: ' + error.message, 'error');
            }
        }
        
        function setCurrentUser() {
            localStorage.setItem('annual_party_user_id', TEST_USER_ID);
            document.getElementById('currentUserId').textContent = TEST_USER_ID;
            addResult('frontendResults', '✅ 已设置当前用户ID: ' + TEST_USER_ID, 'success');
        }
        
        async function testUserListFiltering() {
            clearResults('frontendResults');
            addResult('frontendResults', '开始测试用户列表过滤...', 'info');
            
            const currentUserId = localStorage.getItem('annual_party_user_id');
            if (!currentUserId) {
                addResult('frontendResults', '❌ 请先设置当前用户', 'error');
                return;
            }
            
            try {
                // 模拟用户列表数据
                const mockUsers = [
                    { id: currentUserId, name: '当前用户', gender: 'male' },
                    { id: 'other1', name: '其他用户1', gender: 'female' },
                    { id: 'other2', name: '其他用户2', gender: 'male' }
                ];
                
                // 应用过滤逻辑（模拟用户列表页面的逻辑）
                const filteredUsers = mockUsers.filter(user => user.id !== currentUserId);
                
                if (filteredUsers.length === 2 && !filteredUsers.some(u => u.id === currentUserId)) {
                    addResult('frontendResults', '✅ 用户列表正确过滤掉当前用户', 'success');
                    addResult('frontendResults', '过滤后用户数量: ' + filteredUsers.length, 'info');
                } else {
                    addResult('frontendResults', '❌ 用户列表过滤失败', 'error');
                }
                
            } catch (error) {
                addResult('frontendResults', '❌ 测试出错: ' + error.message, 'error');
            }
        }
        
        // 页面加载时显示当前用户ID
        document.addEventListener('DOMContentLoaded', function() {
            const currentUserId = localStorage.getItem('annual_party_user_id');
            if (currentUserId) {
                document.getElementById('currentUserId').textContent = currentUserId;
            }
        });
    </script>
</body>
</html>
